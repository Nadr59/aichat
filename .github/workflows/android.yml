name: Build and Test AiChat

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  emulator-test:
    name: Emulator Crash Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk/

      - name: Create test script
        run: |
          cat > test_script.sh << 'SCRIPT'
          #!/bin/bash
          set -e

          echo "📱 Device ready"
          adb shell getprop ro.build.version.release

          echo "📦 Installing APK..."
          adb install -r apk/app-debug.apk
          echo "✅ Installed"

          echo "🧹 Clearing logcat..."
          adb logcat -c
          sleep 2

          echo "🚀 Launching AiChat..."
          adb shell am start -n "com.example.aichat/.MainActivity"
          echo "✅ App launched"

          echo "⏳ Monitoring for 30 seconds..."
          sleep 30

          echo "📋 Collecting logcat..."
          adb logcat -d > logcat_full.txt 2>&1 || true
          echo "Total lines: $(wc -l < logcat_full.txt)"

          echo "🔍 Extracting errors..."
          grep -E "FATAL EXCEPTION|AndroidRuntime|aichat|GeckoRuntime|ChatDatabase|NullPointer|IllegalState|OutOfMemory" \
            logcat_full.txt > logcat_errors.txt 2>/dev/null || echo "No errors found" > logcat_errors.txt

          echo ""
          echo "======= CRASH REPORT ======="
          if grep -q "FATAL EXCEPTION" logcat_full.txt; then
            echo "❌ FATAL CRASH DETECTED!"
            echo ""
            grep -A 25 "FATAL EXCEPTION" logcat_full.txt | head -80
          else
            echo "✅ No crash detected"
            echo ""
            echo "--- App logs ---"
            grep -E "aichat|AichatApp|GeckoRuntime|ChatDatabase|WebPlatform" logcat_full.txt | tail -30 || echo "No app logs"
          fi
          echo "==========================="

          echo ""
          echo "📊 Stats:"
          echo "  Fatal:    $(grep -c 'FATAL' logcat_full.txt 2>/dev/null || echo 0)"
          echo "  Errors:   $(grep -c ' E com.example' logcat_full.txt 2>/dev/null || echo 0)"
          echo "  Warnings: $(grep -c ' W com.example' logcat_full.txt 2>/dev/null || echo 0)"
          SCRIPT
          chmod +x test_script.sh

      - name: Run on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          cores: 2
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash test_script.sh

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-report
          path: |
            logcat_full.txt
            logcat_errors.txt
          retention-days: 7
