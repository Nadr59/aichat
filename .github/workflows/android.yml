name: Build and Test AiChat

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ════════════════════════════════════════════════════════════
  # Job 1: بناء APK
  # ════════════════════════════════════════════════════════════
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # رفع APK للـ job التالي
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  # ════════════════════════════════════════════════════════════
  # Job 2: تشغيل على المحاكي وجمع logcat
  # ════════════════════════════════════════════════════════════
  emulator-test:
    name: Emulator Crash Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── تفعيل KVM للمحاكاة السريعة ──────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # ── تحميل APK من Job السابق ──────────────────────────────────────
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk/

      - name: Verify APK exists
        run: |
          ls -lh apk/
          file apk/app-debug.apk

      # ── تشغيل المحاكي ────────────────────────────────────────────────
      - name: Run Emulator and Collect Logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          cores: 2
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          disable-animations: true
          script: |
            # ── التحقق من جاهزية الجهاز ────────────────────────────
            echo "📱 Waiting for device..."
            adb wait-for-device
            adb shell getprop ro.build.version.release

            # ── تثبيت APK ──────────────────────────────────────────
            echo "📦 Installing APK..."
            adb install -r apk/app-debug.apk
            echo "✅ APK installed"

            # ── مسح logcat القديم ──────────────────────────────────
            adb logcat -c
            echo "🧹 Logcat cleared"

            # ── تشغيل التطبيق ──────────────────────────────────────
            echo "🚀 Launching AiChat..."
            adb shell am start \
              -n com.example.aichat/.MainActivity \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER

            # ── انتظار 30 ثانية لالتقاط الانهيار العشوائي ──────────
            echo "⏳ Monitoring for 30 seconds..."
            sleep 30

            # ── جمع logcat كامل ─────────────────────────────────────
            echo "📋 Collecting logcat..."
            adb logcat -d \
              --pid=$(adb shell pidof com.example.aichat 2>/dev/null || echo "") \
              > logcat_full.txt 2>&1 || \
            adb logcat -d > logcat_full.txt 2>&1

            echo "📄 Total lines: $(wc -l < logcat_full.txt)"

            # ── استخراج الأخطاء الحرجة ─────────────────────────────
            echo "🔍 Extracting crashes..."
            grep -E \
              "FATAL EXCEPTION|AndroidRuntime|CRASH|aichat|GeckoRuntime|RoomDatabase|\
              NullPointerException|IllegalStateException|OutOfMemoryError|\
              ANR|Unhandled exception" \
              logcat_full.txt > logcat_errors.txt 2>/dev/null || \
              echo "No matching errors" > logcat_errors.txt

            # ── طباعة ملخص في الـ CI log ────────────────────────────
            echo ""
            echo "╔══════════════════════════════════════╗"
            echo "║         CRASH REPORT SUMMARY          ║"
            echo "╚══════════════════════════════════════╝"
            echo ""

            if grep -q "FATAL EXCEPTION" logcat_full.txt; then
              echo "❌ FATAL CRASH DETECTED!"
              echo ""
              echo "--- Crash Details ---"
              grep -A 20 "FATAL EXCEPTION" logcat_full.txt | head -60
              echo "-------------------"
              echo ""
              echo "📥 Download 'logcat-report' artifact for full details"
              # لا نوقف الـ workflow — نكمل لرفع الملفات
            else
              echo "✅ No FATAL EXCEPTION found"
              echo ""
              echo "--- Last 20 lines of aichat log ---"
              grep "aichat\|AichatApp\|GeckoRuntime\|ChatDatabase" \
                logcat_full.txt | tail -20 || echo "No app-specific logs found"
            fi

            echo ""
            echo "📊 Error summary:"
            echo "  Errors:    $(grep -c ' E ' logcat_full.txt || echo 0)"
            echo "  Warnings:  $(grep -c ' W ' logcat_full.txt || echo 0)"
            echo "  Fatals:    $(grep -c 'FATAL' logcat_full.txt || echo 0)"

      # ── رفع logcat دائماً (حتى عند الفشل) ──────────────────────────
      - name: Upload Logcat Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-report
          path: |
            logcat_full.txt
            logcat_errors.txt
          retention-days: 7
