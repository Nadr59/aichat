name: Build and Test AiChat

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # ── APK الجهاز الحقيقي (ARM فقط — الحجم الأصلي) ──────────────────
      - name: Build ARM APK
        run: ./gradlew assembleDebug

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-arm
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── APK المحاكي (x86_64 فقط — للاختبار فقط) ──────────────────────
      - name: Build x86_64 APK for emulator
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.build.abi=x86_64

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-x86
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  emulator-test:
    name: Emulator Crash Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── تحميل APK المحاكي فقط ─────────────────────────────────────────
      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk-x86
          path: apk/

      - name: Create test script
        run: |
          cat > test_script.sh << 'EOF'
          #!/bin/bash

          echo "📱 Android: $(adb shell getprop ro.build.version.release)"
          echo "📱 ABI:     $(adb shell getprop ro.product.cpu.abi)"

          echo "📦 Installing APK..."
          adb install -r apk/app-debug.apk
          echo "✅ Installed"

          adb logcat -c
          sleep 2

          echo "🚀 Launching app..."
          adb shell am start -n "com.example.aichat/.MainActivity"

          echo "⏳ Monitoring 35 seconds..."
          for i in 1 2 3 4 5 6 7; do
            sleep 5
            PID=$(adb shell pidof com.example.aichat 2>/dev/null | tr -d '\r' || echo "")
            if [ -n "$PID" ]; then
              echo "  ✅ t=${i}0s — running (PID: $PID)"
            else
              echo "  ❌ t=${i}0s — not running"
            fi
          done

          echo "📋 Collecting logcat..."
          adb logcat -d > logcat_full.txt 2>&1 || true

          grep -E "FATAL EXCEPTION|has died|avc: denied.*aichat|GeckoRuntime|AichatApp|ChatDatabase" \
            logcat_full.txt > logcat_errors.txt 2>/dev/null || true

          echo ""
          echo "======= REPORT ======="
          FATAL=$(grep -c "FATAL EXCEPTION" logcat_full.txt 2>/dev/null || echo 0)
          DIED=$(grep -c "has died" logcat_full.txt 2>/dev/null || echo 0)
          echo "Fatal:  $FATAL"
          echo "Died:   $DIED"
          echo ""

          if [ "$FATAL" -gt 0 ]; then
            echo "❌ CRASH DETECTED"
            grep -A 25 "FATAL EXCEPTION" logcat_full.txt | head -60
          elif [ "$DIED" -gt 0 ]; then
            echo "⚠️ PROCESS DIED"
            grep "has died" logcat_full.txt
          else
            echo "✅ NO CRASH"
            grep -E "AichatApp|GeckoRuntime" logcat_full.txt | tail -10 || true
          fi
          echo "====================="
          EOF
          chmod +x test_script.sh

      - name: Run on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          cores: 2
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash test_script.sh

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-report
          path: |
            logcat_full.txt
            logcat_errors.txt
          retention-days: 7
