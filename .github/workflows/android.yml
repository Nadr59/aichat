name: Build and Test AiChat

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  test-on-emulator:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk/

      - name: Run Emulator + Logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-options: >
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
          script: |
            # ── تثبيت APK ──────────────────────────────────
            echo "📦 Installing APK..."
            adb install -r apk/app-debug.apk

            # ── مسح logcat القديم ──────────────────────────
            adb logcat -c

            # ── تشغيل التطبيق ──────────────────────────────
            echo "🚀 Launching app..."
            adb shell am start -n com.example.aichat/.MainActivity

            # ── انتظر 20 ثانية لالتقاط الانهيار ───────────
            echo "⏳ Waiting 20 seconds..."
            sleep 20

            # ── جمع logcat ─────────────────────────────────
            echo "📋 Collecting logcat..."
            adb logcat -d > logcat_full.txt

            # ── استخراج الأخطاء فقط ────────────────────────
            echo "🔍 Extracting crashes..."
            adb logcat -d \
              | grep -E "FATAL|AndroidRuntime|CRASH|aichat|Exception|Error" \
              > logcat_errors.txt || true

            # ── طباعة الأخطاء في الـ log ───────────────────
            echo "=== CRASH LOG ==="
            cat logcat_errors.txt || echo "No errors found"
            echo "================="

            # ── التحقق من وجود انهيار ──────────────────────
            if grep -q "FATAL EXCEPTION" logcat_errors.txt; then
              echo "❌ CRASH DETECTED!"
              cat logcat_errors.txt
              exit 1
            else
              echo "✅ No crash detected"
            fi

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            logcat_full.txt
            logcat_errors.txt
